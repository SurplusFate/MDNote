<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <!-- user-scalable=no：禁掉双击/捏合缩放，编辑时光标坐标才不会和视觉错位 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- v1.103 ProseMirror 内核版：Vditor CSS/lute/i18n/sprite（旧版 1900+ 行内联资产）全部移除。
         内核 = pm/editor-pm.dist.js（esbuild 单文件 IIFE，无任何运行时网络请求）。
         Kotlin 侧 EditorController.shouldInterceptRequest 仍按 "editor.html" 文件名拦截本文件，
         在 <head> 最前注入 bootstrap 主题样式 —— 结构不变，注入点依旧成立。 -->
    <!-- v1.53 深色模式首屏防闪兜底：WebView 的 prefers-color-scheme 跟随 App 昼夜，
         文档解析瞬间即按深色取值，先于任何 Kotlin 运行时注入（bootstrap/applyTheme
         均带 !important 或内联样式，优先级更高，值也一致，不会二次跳变）。
         色值与 values-night/colors.xml 同源（剥 alpha）。 -->
    <style id="mdnotes-scheme-dark">
@media (prefers-color-scheme: dark) {
:root{--bg-page:#111111;--paper:#232325;--text:#F2F2F2;--text-sub:#EBEBEB;--brand:#A36731;--code-bg:#2A2A2C;--table-border:#3A3A3C;}
html,body{background:var(--bg-page);}
.md-content{color:var(--text);background:var(--paper);}
.md-toolbar{background-color:var(--paper);}
.md-panel{background-color:var(--paper);}
.md-source{background:var(--paper);color:var(--text);}
}
</style>
    <style>
/* ===================== 基础布局 ===================== */
html, body { height: 100%; margin: 0; padding: 0; background: var(--bg-page, #f7f4ef); }
#paper { height: 100%; display: flex; flex-direction: column; }

/* ===================== 编辑区（ProseMirror） ===================== */
#md-pm-host { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
#md-pm-host > .ProseMirror { flex: 1 1 auto; }
.md-content {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--paper, transparent);
  color: var(--text, #222);
  caret-color: var(--brand, #ff6f00);
  padding: 12px 16px 24px;
  box-sizing: border-box;
}
/* 空态占位（.md-empty 由 bridge 依据 doc 空判定维护） */
.ProseMirror.md-empty > p::before {
  content: "记点什么…";
  color: var(--text-sub, #9a9a9e);
  pointer-events: none;
  height: 0;
  float: left;
}
.ProseMirror:focus { outline: none; }
.ProseMirror ::selection { background: rgba(255, 111, 0, 0.22); }

/* 块级元素（对齐旧版 Markwon/便签视觉密度） */
.ProseMirror p { margin: 0.5em 0; }
.ProseMirror h1, .ProseMirror h2, .ProseMirror h3,
.ProseMirror h4, .ProseMirror h5, .ProseMirror h6 {
  margin: 0.9em 0 0.45em;
  font-weight: 600;
  line-height: 1.3;
}
.ProseMirror h1 { font-size: 1.5em; }
.ProseMirror h2 { font-size: 1.32em; }
.ProseMirror h3 { font-size: 1.18em; }
.ProseMirror h4 { font-size: 1.08em; }
.ProseMirror h5, .ProseMirror h6 { font-size: 1em; }
.ProseMirror h1:first-child, .ProseMirror h2:first-child,
.ProseMirror h3:first-child { margin-top: 0.3em; }
.ProseMirror ul, .ProseMirror ol { margin: 0.4em 0; padding-left: 1.4em; }
.ProseMirror li p { margin: 0.15em 0; }
.ProseMirror blockquote {
  margin: 0.6em 0;
  padding: 4px 12px;
  border-left: 4px solid var(--table-border, #d0d0d0);
  color: var(--text-sub, #8E8E93);
  background: rgba(128, 128, 128, 0.06);
}
.ProseMirror blockquote p { margin: 0.3em 0; }
.ProseMirror pre {
  margin: 0.6em 0;
  padding: 10px 12px;
  background: var(--code-bg, #f6f6f6);
  border-radius: 6px;
  overflow-x: auto;
}
.ProseMirror pre code {
  font-family: mononoki, Consolas, Menlo, Courier, monospace;
  font-size: 0.92em;
  background: transparent;
  padding: 0;
  white-space: pre;
}
.ProseMirror code {
  font-family: mononoki, Consolas, Menlo, Courier, monospace;
  font-size: 0.92em;
  background: var(--code-bg, #f6f6f6);
  padding: 1px 4px;
  border-radius: 4px;
}
.ProseMirror hr {
  border: none;
  border-top: 1px solid var(--table-border, #d0d0d0);
  margin: 1em 0;
}
.ProseMirror img { max-width: 100%; height: auto; border-radius: 4px; }
.ProseMirror a { color: var(--brand, #ff6f00); text-decoration: none; }
.ProseMirror strong { font-weight: 700; }

/* 任务列表 checkbox（视觉；点击切换由 bridge 的 taskTogglePlugin 处理） */
.ProseMirror li.md-task { list-style: none; position: relative; }
.ProseMirror ul > li.md-task { margin-left: -1.2em; }
.md-task-box {
  display: inline-block;
  width: 15px; height: 15px;
  box-sizing: border-box;
  margin-right: 6px;
  border: 1.5px solid var(--text-sub, #8E8E93);
  border-radius: 4px;
  vertical-align: -2px;
  position: relative;
  user-select: none;
}
li.md-task--on > .md-task-box {
  background: var(--brand, #ff6f00);
  border-color: var(--brand, #ff6f00);
}
li.md-task--on > .md-task-box::after {
  content: "";
  position: absolute;
  left: 3px; top: 0px;
  width: 5px; height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}

/* raw 透传块（表格 / HTML 块）：只读渲染，编辑走源码态 */
.ProseMirror .md-raw[data-md-raw] {
  margin: 0.6em 0;
  border: 1px dashed var(--table-border, #d0d0d0);
  border-radius: 6px;
  padding: 4px 8px;
  overflow-x: auto;
}
.ProseMirror .md-raw table {
  border-collapse: collapse;
  margin: 0;
}
.ProseMirror .md-raw td, .ProseMirror .md-raw th {
  border: 1px solid var(--table-border, #d0d0d0);
  padding: 6px 13px;
  color: var(--text, #222);
}
.ProseMirror .md-raw th { background-color: rgba(128,128,128,0.18); font-weight: 600; }
.ProseMirror .md-raw tbody tr:nth-child(2n) { background-color: rgba(128,128,128,0.08); }

/* ===================== 工具栏 ===================== */
.md-toolbar {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 42px;
  padding: 0 4px;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  background: var(--paper, #fff);
  border-top: 1px solid var(--table-border, #d0d0d0);
  user-select: none;
}
.md-tool {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  min-width: 38px;
  padding: 0 7px;
  border: none;
  background: transparent;
  color: var(--text-sub, #666);
  font-size: 14px;
}
.md-tool svg { width: 16px; height: 16px; fill: currentColor; }
.md-tool--on { color: var(--brand, #ff6f00); }
.md-tool-text { padding: 0 10px; white-space: nowrap; }
.md-caret { font-size: 9px; margin-left: 1px; }

/* 下拉面板（headings） */
.md-panel {
  position: absolute;
  bottom: 44px;
  z-index: 30;
  min-width: 132px;
  padding: 4px;
  border-radius: 8px;
  background: var(--paper, #fff);
  border: 1px solid var(--table-border, #d0d0d0);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
}
.md-panel-item {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 9px 14px;
  border: none;
  background: transparent;
  color: var(--text, #222);
  font-size: 14px;
  text-align: left;
  border-radius: 5px;
}
.md-panel-item--on { color: var(--brand, #ff6f00); font-weight: 600; }

/* ===================== 键盘 dock（类语义与旧版一致） ===================== */
/* 键盘收起：工具栏整体隐藏，不留在顶部占位 */
.mdnotes-kbd-off .md-toolbar { display: none !important; }
/* 键盘弹出：工具栏入流排到内容区之后 → 出现在键盘上沿，不遮挡正文 */
.mdnotes-kbd-on .md-toolbar { order: 99; }
.mdnotes-kbd-on #paper { padding-bottom: 6px; }
/* 下拉面板往上弹（工具栏在底部时） */
.mdnotes-kbd-on .md-toolbar .md-panel { top: auto; bottom: 44px; }
/* 悬浮键盘：窗口不 resize，工具栏钉在可视区顶部（旧版 v1.60 行为） */
.mdnotes-kbd-float .md-toolbar {
  position: fixed !important;
  top: 0; left: 0; right: 0;
  z-index: 30;
  border-top: none;
  border-bottom: 1px solid var(--table-border, #d0d0d0);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}
.mdnotes-kbd-float .md-toolbar .md-panel { top: 44px; bottom: auto; }
.mdnotes-kbd-float #md-pm-host { padding-top: 44px; }

/* ===================== 全屏 ===================== */
.mdnotes-fullscreen #paper {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg-page, #fff);
}

/* ===================== 源码模式 ===================== */
.md-source {
  flex: 1 1 0;
  min-height: 0;
  display: none;
  box-sizing: border-box;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 12px 16px 24px;
  font-family: mononoki, Consolas, Menlo, Courier, monospace;
  font-size: 15px;
  line-height: 1.55;
  background: var(--paper, #fff);
  color: var(--text, #222);
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-overflow-scrolling: touch;
}
    </style>
</head>
<body>
    <div id="paper">
        <div id="md-pm-host" class="md-content"></div>
        <textarea id="md-source" class="md-source" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
        <div id="md-toolbar" class="md-toolbar"></div>
    </div>
    <script src="pm/editor-pm.dist.js"></script>
</body>
</html>
